<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Mapa pociągów w Polsce na żywo: pozycje, opóźnienia, trasy i stacje.">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Trainspotter">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Trainspotter</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>
  <aside class="panel" id="panel">
    <div class="panel-header">
      <button type="button" id="panel-toggle" class="panel-toggle" aria-controls="panel-body" aria-expanded="true"
              aria-label="Pokaż lub ukryj wyszukiwarkę">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
      <h1>Trainspotter</h1>
    </div>
    <div id="panel-body" class="panel-body">
    <form id="search-form" class="search" role="search">
      <input id="search-input" type="search" placeholder="Pociąg lub stacja" aria-label="Szukaj pociągu lub stacji"
             autocomplete="off" spellcheck="false">
      <button type="submit">Szukaj</button>
    </form>
    <ul id="search-results" class="search-results" hidden></ul>
    <p id="status" aria-live="polite">Ładowanie…</p>
    <ul class="legend">
      <li><span class="dot gps"></span>GPS</li>
      <li><span class="dot confirmed"></span>Szacowana: potwierdzone przez PLK</li>
      <li><span class="dot forecast"></span>Szacowana: prognoza PLK</li>
      <li><span class="dot schedule"></span>Szacowana: rozkład</li>
      <li><span class="dot ring"></span>Opóźnienie ≥ 5 min</li>
    </ul>
    </div>
  </aside>
  <dialog id="route-dialog" class="route-dialog" aria-labelledby="route-title">
    <header class="route-header">
      <div>
        <h2 id="route-title"></h2>
        <p id="route-subtitle" class="muted"></p>
      </div>
      <button type="button" class="dialog-close" aria-label="Zamknij">×</button>
    </header>
    <p class="route-legend muted">
      <span class="delay-badge on-time">potwierdzone przez PLK</span>
      <span class="delay-badge on-time forecast">prognoza</span>
    </p>
    <ol id="route-stops" class="route-stops"></ol>
  </dialog>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
